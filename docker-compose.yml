version: '3.8'
services:
  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    env_file: .env
    volumes:
      - .:/app
      - ./documents:/var/ghostwriter/documents
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ghostwriter
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  celery:
    build: .
    command: celery -A core.celery_app worker --loglevel=info
    depends_on:
      - redis
      - postgres
    env_file: .env
    volumes:
      - .:/app
      - ./documents:/var/ghostwriter/documents

  celery-beat:
    build: .
    command: celery -A core.celery_app beat --loglevel=info
    depends_on:
      - redis
    env_file: .env
    volumes:
      - .:/app

volumes:
  postgres_data:
